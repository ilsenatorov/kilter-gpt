# Which model size generates climbs closest to the requested grade? Short runs to rank sizes, then train the winner longer.
program: scripts/train.py
method: grid
metric:
  goal: minimize
  name: test/temp=1.0/cfg=3.0/grade_mae  # watch novel_rate, mean_feet and fixed_prompt_unique_rate for collapse
parameters:
  data_dir:
    value: data/processed-broad-2026
  grade_predictor:
    value: data/grade_predictor.ckpt  # copy the best scripts/train_grade.py checkpoint here
  epochs:
    value: 30
  test_subset:
    value: 0.3
  n_embed:
    values: [128, 256, 512]
  n_layer:
    values: [2, 4, 8]
  n_head:
    value: 8
