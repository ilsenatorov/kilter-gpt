[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kiltergpt"
version = "0.4.0"
description = "Generate Kilterboard climbs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "lightning",
    "wandb",
    "beartype",
    "opencv-python",
    "pandas",
    "matplotlib",
    "numpy==1.25.2",
    "fastapi",
    "uvicorn",
    "supabase",
    "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kiltergpt*"]

[tool.ruff]
target-version = "py311"
line-length = 119
fix = true
lint.select = ["E","F","W","B"]
lint.ignore = ["E501", "F841", "F811", "F401"]
